server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths (client-side routes) all serve index.html
    # so React Router can take over, instead of nginx 404ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
